{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vengelico Jewellery{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'home' %}" class="logo">Vengelico</a>
        <button class="menu-btn" type="button" aria-label="Open menu">Menu</button>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'shop' %}">Shop</a>
            <a href="{% url 'contact' %}">Contact</a>
            <a href="{% url 'cart' %}">Cart</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Vengelico Jewellery. Crafted with elegance.</p>
    </footer>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
